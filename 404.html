<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · Никита Белосохов</title>
<script>
  // Старые адреса проектов были на кириллице. Переадресуем их на новые, чтобы ссылки из откликов не ломались.
  (function () {
    var map = {
      "портфолио/аналитика/юнит-экономика": "projects/unit-economics",
      "портфолио/аналитика/дашборд-продаж": "projects/sales-dashboard",
      "портфолио/аналитика/abc-анализ": "projects/abc-analysis",
      "портфолио/сайты/антикварная-лавка": "sites/antique-shop",
      "портфолио/сайты/цветочная-мастерская": "sites/flower-shop",
      "портфолио/сайты/кофейня-к": "sites/coffee-k",
      "портфолио": ""
    };
    var path;
    try { path = decodeURIComponent(location.pathname); } catch (e) { path = location.pathname; }
    for (var oldPath in map) {
      var i = path.indexOf("/" + oldPath);
      if (i !== -1) {
        var base = path.slice(0, i + 1);
        var rest = path.slice(i + 1 + oldPath.length).replace(/^\//, "");
        var target = base + map[oldPath] + (map[oldPath] && rest ? "/" + rest : (map[oldPath] ? "/" : ""));
        location.replace(target + location.search + location.hash);
        return;
      }
    }
  })();
</script>
<style>
  :root{--bg:#f3f5f8;--fg:#18202d;--muted:#5b687a;--accent:#d9601f;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--fg:#e6ebf2;--muted:#94a1b3;--accent:#f0884a;color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#11151b;--fg:#e6ebf2;--muted:#94a1b3;--accent:#f0884a;color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Segoe UI",sans-serif;padding:16px}
  main{max-width:440px;text-align:center}
  b{font:600 56px ui-monospace,Consolas,monospace;color:var(--accent);display:block}
  p{color:var(--muted)}
  a{color:var(--accent)}
</style>

</main>
